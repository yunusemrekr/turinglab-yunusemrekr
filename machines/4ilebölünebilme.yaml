name: "divisible_by_4"
states: [q0, q_check1, q_check2, q_accept]
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", "B"]
blank: "B"
start_state: q0
accept_states: [q_accept]
reject_states: []
transitions:
  - {state: q0, read: "0", next: q0, write: "0", move: R}
  - {state: q0, read: "1", next: q0, write: "1", move: R}
  - {state: q0, read: "B", next: q_check1, write: "B", move: L}
  - {state: q_check1, read: "0", next: q_check2, write: "0", move: L}
  - {state: q_check2, read: "0", next: q_accept, write: "0", move: R}
  - {state: q_check2, read: "B", next: q_accept, write: "B", move: R}
